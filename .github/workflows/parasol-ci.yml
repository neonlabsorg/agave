name: Parasol ci

on:
  workflow_dispatch:
  push:
    branches:
      - parasol-dev
      - parasol-fork-dev-ci


permissions:
  contents: write
  packages: write

jobs:
  build_and_release:
    runs-on: ["gha-runner-scale-set-large"]
    outputs:
      archive: ${{ steps.pack.outputs.archive }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build artifacts via Docker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./bin
          mkdir -p ./bin

          DOCKER_BUILDKIT=1 docker build \
            -f docker/Dockerfile.ubuntu24-build \
            --target artifacts \
            --output type=local,dest=./bin \
            --build-arg AGAVE_REF=$(git rev-parse --abbrev-ref HEAD) \
            --no-cache \
            .

          echo "Build output:"
          ls -la ./bin

      - name: Archive binaries (zip, add branch name)
        id: pack
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"
          SAFE_BRANCH="${BRANCH//\//-}"

          ARCHIVE="bin-${SAFE_BRANCH}.zip"

          cd bin
          zip -r "../${ARCHIVE}" .
          cd ..

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

          echo "Created archive: ${ARCHIVE}"
          ls -la "${ARCHIVE}"

      - name: Upload archive as GHA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.archive }}
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build_and_release
    uses: ./.github/workflows/push-via-oras.yml
    with:
      dockerhub-namespace: neonlabsorg
      artifact-name: parasol-validator-bin
      gha-artifact-name: ${{ needs.build_and_release.outputs.archive }}
      artifact-media-type: application/zip
      source-repository: neonlabsorg/agave
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
