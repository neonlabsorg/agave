# --- Parasol fork: the sbf workspace is EXCLUDED from the root workspace, so it does
# NOT inherit the root [patch.crates-io]; mirror it here so agave path-deps (e.g.
# agave-syscalls `WritableAccount::set_subaccount_mark`) resolve against the vendored
# ../../parasol/solana-sdk instead of stock crates.io. Entries = root Cargo.toml with
# ../solana-sdk -> ../../parasol/solana-sdk (one level deeper). Keep in sync with root.
[patch.crates-io]
# for details, see https://github.com/anza-xyz/crossbeam/commit/fd279d707025f0e60951e429bf778b4813d1b6bf
crossbeam-epoch = { git = "https://github.com/anza-xyz/crossbeam", rev = "fd279d707025f0e60951e429bf778b4813d1b6bf" }
rustls-webpki = { git = "https://github.com/anza-xyz/rustls-webpki", tag = "anza-0.103.10-2" }
rustls-webpki2 = { git = "https://github.com/anza-xyz/rustls-webpki", package = "rustls-webpki", tag = "anza-0.101.7-2" }

# Parasol fork (franken-branch parasol-fork-dev-v4): blanket path-patch of the SDK onto agave-4.0.3
# versions, carrying F1(100ms clock)/F2(gasless fee-calculator)/F3(rent-removal rent). ../solana-sdk
# is a sibling on disk, mounted at /solana-sdk inside the Docker build (see agave-build/build.sh).
# v3-style blanket: every franken crate whose version matches a version agave uses is patched, so a
# patched crate never drags a mismatched foundational version (the E0308 trap). MULTI crates (address,
# hash, pubkey, packet, define-syscall, system-interface) are patched at the franken version; agave's
# OTHER version of each still resolves from registry (patch replaces exactly the matching version).
# rent stays franken 3.0.0 carrying F3 (economics=0, minimum_balance()==0). agave's own workspace pins
# `solana-rent = "3.0.0"` (^3) and pristine sysvar 3.1.1 / genesis-config 3.0.0 also want rent 3.0.0, so
# the franken workspace root must pin `solana-rent version="3.0.0"` (NOT the stale 4.0.0) -> every rent
# consumer unifies on the patched franken rent 3.0.0 (single version, serde feature enabled once).
# genesis-config (pristine 3.0.0) resolves against it and is patched too.
# EXCLUDED: logger + quic-definitions (absent from franken). Former-MISMATCH crates are re-pinned to
# agave versions (above) and patched. Regenerate: agave-build/gen_blanket_patch.sh -> scratchpad/compose_patch_block.sh.
solana-clock = { path = "../../parasol/solana-sdk/clock" }
solana-rent = { path = "../../parasol/solana-sdk/rent" }
solana-fee-calculator = { path = "../../parasol/solana-sdk/fee-calculator" }
# former MISMATCH crates, re-pinned (git checkout <dir>@v<agave-ver>) to agave-4.0.3 versions and
# patched so a patched franken crate can't drag its franken version transitively and collide with
# the registry version at a bridge crate -> E0277/E0308 (e.g. stake-interface's `?` vs two ProgramErrors).
solana-account-info = { path = "../../parasol/solana-sdk/account-info" }
solana-bls-signatures = { path = "../../parasol/solana-sdk/bls-signatures" }
solana-borsh = { path = "../../parasol/solana-sdk/borsh" }
solana-program-error = { path = "../../parasol/solana-sdk/program-error" }
solana-program-option = { path = "../../parasol/solana-sdk/program-option" }
